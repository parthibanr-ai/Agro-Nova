global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: agro-nova-api  # the alert rules expect this name
    metrics_path: /metrics
    authorization:
      credentials_file: /etc/prometheus/admin_key  # the ADMIN_API_KEY, written by the steps in README.md
    static_configs:
      # An API running on your machine on port 8000 (uvicorn app.main:app --port 8000). Change the port to suit,
      # or put the address of a deployed instance here (and add `scheme: https`).
      - targets: ["host.docker.internal:8000"]
