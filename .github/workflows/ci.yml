name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests and load-regression gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: agrin_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      # Also runs the Postgres-only tests (migrations, first-login race, jobs, notifications) on a real database.
      TEST_POSTGRES_URL: postgresql://postgres:ci@localhost:5432/agrin_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: Upstream-call budget (fails if a change makes more Gemini / Earth Engine / weather calls per farmer)
        run: python scripts/simulate_sessions.py 150 0.3 --check
      - name: Alert rules are valid PromQL
        run: >-
          docker run --rm -v "${{ github.workspace }}/ops:/rules:ro" --entrypoint promtool
          prom/prometheus:latest check rules /rules/alerts.yml

  image:
    name: Docker image builds and migrates a fresh Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: agrin_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t agrin-api backend
      - name: Apply migrations to an empty database, then start the API
        run: |
          docker run --rm --network host -e DATABASE_URL=postgres://postgres:ci@localhost:5432/agrin_ci agrin-api python -m app.migrate
          docker run -d --name api --network host -e DATABASE_URL=postgres://postgres:ci@localhost:5432/agrin_ci -e PORT=8080 agrin-api
          for _ in $(seq 1 30); do curl -sf http://localhost:8080/api/v1/ready && break; sleep 1; done
          curl -sf http://localhost:8080/api/v1/ready

  app:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      # A few style hints exist in older files; real problems (warnings and errors) still fail the build.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
